<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <title>Pair Glide</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="page">
    <main class="card">
      <header>
        <img src="icons/icon48.png" alt="" />
        <h1>Pair with Glide</h1>
      </header>
      <section id="confirm" hidden>
        <p class="lead">Let Glide use this Chrome?</p>
        <p>Glide will be able to open, read and act in your tabs, signed in as you.</p>
        <div class="status">
          <div>
            <div class="meta">Connects to</div>
            <div id="target"></div>
          </div>
        </div>
        <div id="portWarning" class="notice" hidden></div>
        <p id="replaceNote" class="meta" hidden>This replaces the pairing this Chrome has now.</p>
        <p class="meta">Only continue if you just clicked Pair in Glide's Settings › Browser.</p>
        <div class="row">
          <button id="pair" class="primary">Pair</button>
          <button id="cancel">Cancel</button>
        </div>
      </section>
      <div id="state" class="status" role="status" aria-live="polite" hidden>
        <span id="dot" class="dot"></span>
        <div>
          <div id="detail"></div>
          <div id="meta" class="meta"></div>
        </div>
      </div>
      <div id="error" class="error" hidden></div>
    </main>
    <script src="common.js"></script>
    <script src="pair.js"></script>
  </body>
</html>
